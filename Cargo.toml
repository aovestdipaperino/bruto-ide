[package]
name = "bruto-ide"
version = "1.0.3"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
repository = "https://github.com/aovestdipaperino/bruto-ide"
description = "A pluggable TUI IDE framework built with Turbo Vision for Rust"
